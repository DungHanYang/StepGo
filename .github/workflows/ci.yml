name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore StepGo.sln

      - name: Format check
        run: dotnet format StepGo.sln --verify-no-changes

      - name: Build
        run: dotnet build StepGo.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test StepGo.sln --no-build --configuration Release

  infra-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: cdk synth
        working-directory: infra/StepGo.Infra
        run: cdk synth
