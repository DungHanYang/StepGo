<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>
body{margin:0;background:#f2eee6;color:#22201c;font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#22201c;text-decoration:underline}a:hover{color:#4a463d}
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh;align-items:stretch}
.side{background:#e3dcd1;color:#2b2822;display:flex;flex-direction:column;gap:4px;padding:20px 13px 24px}
.side .brand{display:flex;align-items:center;gap:10px;color:#2b2822;padding:4px 8px 18px;flex:none}
.side .account{margin-top:auto;border-top:1px solid #cfc4b2;padding:14px 0 0 8px;display:flex;align-items:center;gap:9px}
.pad{padding:22px 30px}
.teacherrow{display:grid;grid-template-columns:minmax(160px,1.6fr) 100px 90px 90px 80px;gap:10px}
.courserow{display:grid;grid-template-columns:minmax(160px,1.8fr) 110px 90px 90px 80px;gap:10px}
@media(max-width:1080px){
 .shell{grid-template-columns:1fr}
 .side{flex-direction:row;align-items:center;gap:10px;padding:10px 14px;overflow:auto}
 .side .brand{padding:0 10px 0 0}
 .side .account{display:none !important}
 .pad{padding:18px 22px}
}
@media(max-width:640px){.pad{padding:15px 16px}}
</style></helmet>

<div class="shell">

<aside class="side">
<div class="brand">
<div style="width:32px;height:32px;border-radius:50%;border:1px solid #bfb29c;background:#d2c6b4;display:flex;align-items:center;justify-content:center;font:700 14px 'Noto Serif TC',serif;flex:none;color:#2b2822">學</div>
<div style="display:flex;flex-direction:column;line-height:1.15">
<span style="font:700 14px 'Noto Serif TC',serif">學步</span>
<span style="font:500 9px 'EB Garamond',serif;letter-spacing:.2em;color:#8c7f6c">ADMIN</span>
</div>
</div>
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
<a href="{{ n.href }}" style="display:flex;align-items:center;gap:10px;border-radius:3px;padding:9px 10px;font:{{ n.font }};background:{{ n.bg }};color:{{ n.fg }};flex:none;white-space:nowrap">
<span style="font:400 12px 'EB Garamond',serif;color:{{ n.dim }};width:14px;flex:none">{{ n.num }}</span>{{ n.label }}
</a>
</sc-for>
<div class="account">
<div style="width:30px;height:30px;border-radius:50%;background:#d2c6b4;border:1px solid #bfb29c;display:flex;align-items:center;justify-content:center;font:600 12px 'Noto Serif TC',serif;flex:none;color:#2b2822">客</div>
<div style="display:flex;flex-direction:column;line-height:1.3;min-width:0">
<span style="font:500 13px 'Noto Sans TC';color:#2b2822">客服／營運</span>
<span style="font:400 10.5px 'Noto Sans TC';color:#8c7f6c">查看權限</span>
</div>
</div>
</aside>

<main style="min-width:0;display:flex;flex-direction:column;background:#f7f4ee">

<header class="pad" style="display:flex;align-items:center;gap:14px;border-bottom:1px solid #ded7c9;flex-wrap:wrap">
<h1 style="font:700 19px 'Noto Serif TC',serif;margin:0">{{ title }}</h1>
<div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<div style="display:flex;border:1px solid #ded7c9;border-radius:99px;overflow:hidden">
<button onClick="{{ goTeachers }}" style="border:none;background:{{ teacherTabBg }};color:{{ teacherTabFg }};padding:7px 15px;font:500 13px 'Noto Sans TC';cursor:pointer">老師</button>
<button onClick="{{ goCourses }}" style="border:none;background:{{ courseTabBg }};color:{{ courseTabFg }};padding:7px 15px;font:500 13px 'Noto Sans TC';cursor:pointer">課程</button>
</div>
<input value="{{ search }}" onChange="{{ setSearch }}" placeholder="搜尋姓名／課程名稱" style="border:1px solid #ded7c9;border-radius:99px;background:#fdfbf6;padding:8px 14px;font:400 13px 'Noto Sans TC';color:#22201c;width:200px">
</div>
</header>

<div class="pad" style="display:flex;flex-direction:column;gap:20px;padding-bottom:60px">

<sc-if value="{{ isTeachers }}" hint-placeholder-val="{{ true }}">
<section style="border:1px solid #ded7c9;border-radius:4px;background:#fdfbf6;overflow-x:auto">
<div class="teacherrow" style="padding:11px 20px;background:#efeade;font:500 11.5px 'Noto Sans TC';color:#4a463d;letter-spacing:.04em">
<span>老師</span><span>驗證狀態</span><span style="text-align:right">課程數</span><span style="text-align:right">本月營收</span><span></span>
</div>
<sc-for list="{{ teachers }}" as="t" hint-placeholder-count="6">
<div class="teacherrow" style="padding:13px 20px;border-top:1px solid #ece6da;align-items:center">
<div style="min-width:0"><div style="font:500 13.5px 'Noto Sans TC';color:#22201c">{{ t.name }}</div><div style="font:400 11.5px 'Noto Sans TC';color:#6c6659">{{ t.email }}</div></div>
<span style="font:500 12px 'Noto Sans TC';color:{{ t.stFg }};background:{{ t.stBg }};border-radius:2px;padding:3px 8px;justify-self:start">{{ t.status }}</span>
<span style="font:400 13px ui-monospace,Menlo,monospace;color:#4a463d;text-align:right">{{ t.courses }}</span>
<span style="font:500 13.5px ui-monospace,Menlo,monospace;color:#22201c;text-align:right">{{ t.revenue }}</span>
<a href="./StepGo Teacher Verification.dc.html" style="font:400 12.5px 'Noto Sans TC';text-align:right">查看</a>
</div>
</sc-for>
<sc-if value="{{ teachersEmpty }}" hint-placeholder-val="{{ false }}">
<div style="padding:34px 20px;text-align:center;font:400 13px 'Noto Sans TC';color:#6c6659">沒有符合「{{ search }}」的老師</div>
</sc-if>
</section>
</sc-if>

<sc-if value="{{ isCourses }}" hint-placeholder-val="{{ false }}">
<section style="border:1px solid #ded7c9;border-radius:4px;background:#fdfbf6;overflow-x:auto">
<div class="courserow" style="padding:11px 20px;background:#efeade;font:500 11.5px 'Noto Sans TC';color:#4a463d;letter-spacing:.04em">
<span>課程</span><span>老師</span><span>狀態</span><span style="text-align:right">報名數</span><span></span>
</div>
<sc-for list="{{ courses }}" as="c" hint-placeholder-count="6">
<div class="courserow" style="padding:13px 20px;border-top:1px solid #ece6da;align-items:center">
<span style="font:500 13.5px 'Noto Sans TC';color:#22201c;text-wrap:pretty">{{ c.title }}</span>
<span style="font:400 12.5px 'Noto Sans TC';color:#6c6659">{{ c.teacher }}</span>
<span style="font:500 12px 'Noto Sans TC';color:{{ c.stFg }};background:{{ c.stBg }};border-radius:2px;padding:3px 8px;justify-self:start">{{ c.status }}</span>
<span style="font:400 13px ui-monospace,Menlo,monospace;color:#4a463d;text-align:right">{{ c.seats }}</span>
<a href="./StepGo Courses.dc.html" style="font:400 12.5px 'Noto Sans TC';text-align:right">查看</a>
</div>
</sc-for>
<sc-if value="{{ coursesEmpty }}" hint-placeholder-val="{{ false }}">
<div style="padding:34px 20px;text-align:center;font:400 13px 'Noto Sans TC';color:#6c6659">沒有符合「{{ search }}」的課程</div>
</sc-if>
</section>
</sc-if>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const NAV = [
  { num: "01", label: "金流總覽", href: "./StepGo Admin Cashflow.dc.html" },
  { num: "02", label: "費用設定", href: "./StepGo Admin Fees.dc.html" },
  { num: "03", label: "老師與課程", href: "#", active: true },
  { num: "04", label: "帳號與權限", href: "./StepGo Admin Accounts.dc.html" },
  { num: "05", label: "仲裁案件", href: "./StepGo Arbitration.dc.html" },
  { num: "06", label: "帳戶審核", href: "./StepGo Teacher Verification.dc.html" }
];

const TEACHERS = [
  { name: "陳彥霖", email: "chen.yenlin@example.com", status: "已驗證", stFg: "#2f5560", stBg: "#e3ecec", courses: 5, revenue: "NT$ 98,284" },
  { name: "吳曉恩", email: "wu.hsiaoen@example.com", status: "已驗證", stFg: "#2f5560", stBg: "#e3ecec", courses: 2, revenue: "NT$ 6,600" },
  { name: "林思如", email: "lin.sizhu@example.com", status: "已驗證", stFg: "#2f5560", stBg: "#e3ecec", courses: 3, revenue: "NT$ 9,000" },
  { name: "黃柏睿", email: "huang.borui@example.com", status: "已驗證", stFg: "#2f5560", stBg: "#e3ecec", courses: 2, revenue: "NT$ 7,200" },
  { name: "許雅涵", email: "hsu.yahan@example.com", status: "審核中", stFg: "#a7622c", stBg: "#fdf7f0", courses: 0, revenue: "—" },
  { name: "鄭立群", email: "cheng.liqun@example.com", status: "未通過", stFg: "#8a4b3f", stBg: "#fdf5f2", courses: 0, revenue: "—" }
];

const COURSES = [
  { title: "從零開始的木工手作：做一張小板凳", teacher: "陳彥霖", status: "招生中", stFg: "#2f5560", stBg: "#e3ecec", seats: "16/20" },
  { title: "手沖咖啡入門：從磨豆到萃取", teacher: "黃柏睿", status: "招生中", stFg: "#2f5560", stBg: "#e3ecec", seats: "4/6" },
  { title: "植物染基礎：藍染方巾兩件", teacher: "吳曉恩", status: "招生中", stFg: "#2f5560", stBg: "#e3ecec", seats: "4/10" },
  { title: "給上班族的鋼筆字練習課", teacher: "林思如", status: "已結束", stFg: "#6c6659", stBg: "#efeade", seats: "18/20" },
  { title: "進階榫接：小邊几", teacher: "陳彥霖", status: "審核中", stFg: "#a7622c", stBg: "#fdf7f0", seats: "0/6" }
];

class Component extends DCLogic {
  state = { tab: "teachers", search: "" };
  renderVals() {
    const { tab } = this.state;
    const q = this.state.search.trim().toLowerCase();
    const teachers = TEACHERS.filter(t => !q || t.name.toLowerCase().includes(q) || t.email.toLowerCase().includes(q));
    const courses = COURSES.filter(c => !q || c.title.toLowerCase().includes(q) || c.teacher.toLowerCase().includes(q));
    return {
      nav: NAV.map(n => ({
        ...n,
        font: (n.active ? "500" : "400") + " 13.5px 'Noto Sans TC'",
        bg: n.active ? "#d2c6b4" : "transparent",
        fg: n.active ? "#22201c" : "#5c5347",
        dim: n.active ? "#a7622c" : "#a89a84"
      })),
      title: tab === "teachers" ? "老師與課程 · 老師" : "老師與課程 · 課程",
      isTeachers: tab === "teachers", isCourses: tab === "courses",
      goTeachers: () => this.setState({ tab: "teachers" }), goCourses: () => this.setState({ tab: "courses" }),
      teacherTabBg: tab === "teachers" ? "#22201c" : "transparent", teacherTabFg: tab === "teachers" ? "#f7f4ee" : "#4a463d",
      courseTabBg: tab === "courses" ? "#22201c" : "transparent", courseTabFg: tab === "courses" ? "#f7f4ee" : "#4a463d",
      search: this.state.search, setSearch: e => this.setState({ search: e.target.value }),
      teachers, teachersEmpty: teachers.length === 0,
      courses, coursesEmpty: courses.length === 0
    };
  }
}
</script>
</body>
</html>
