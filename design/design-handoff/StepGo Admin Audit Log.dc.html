<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>
body{margin:0;background:#f2eee6;color:#22201c;font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#22201c;text-decoration:underline}a:hover{color:#4a463d}
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh;align-items:stretch}
.side{background:#e3dcd1;color:#2b2822;display:flex;flex-direction:column;gap:4px;padding:20px 13px 24px}
.side .brand{display:flex;align-items:center;gap:10px;color:#2b2822;padding:4px 8px 18px;flex:none}
.side .account{margin-top:auto;border-top:1px solid #cfc4b2;padding:14px 0 0 8px;display:flex;align-items:center;gap:9px}
.pad{padding:22px 30px}
.logrow{display:grid;grid-template-columns:132px minmax(0,1fr) 110px;gap:14px}
@media(max-width:1080px){
 .shell{grid-template-columns:1fr}
 .side{flex-direction:row;align-items:center;gap:10px;padding:10px 14px;overflow:auto}
 .side .brand{padding:0 10px 0 0}
 .side .account{display:none !important}
 .pad{padding:18px 22px}
}
@media(max-width:640px){
 .pad{padding:15px 16px}
 .logrow{grid-template-columns:minmax(0,1fr);gap:4px}
 .logrow span:last-child{justify-self:start !important}
}
</style></helmet>

<div class="shell">

<aside class="side">
<div class="brand">
<div style="width:32px;height:32px;border-radius:50%;border:1px solid #bfb29c;background:#d2c6b4;display:flex;align-items:center;justify-content:center;font:700 14px 'Noto Serif TC',serif;flex:none;color:#2b2822">學</div>
<div style="display:flex;flex-direction:column;line-height:1.15">
<span style="font:700 14px 'Noto Serif TC',serif">學步</span>
<span style="font:500 9px 'EB Garamond',serif;letter-spacing:.2em;color:#8c7f6c">ADMIN</span>
</div>
</div>
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
<a href="{{ n.href }}" style="display:flex;align-items:center;gap:10px;border-radius:3px;padding:9px 10px;font:{{ n.font }};background:{{ n.bg }};color:{{ n.fg }};flex:none;white-space:nowrap">
<span style="font:400 12px 'EB Garamond',serif;color:{{ n.dim }};width:14px;flex:none">{{ n.num }}</span>{{ n.label }}
</a>
</sc-for>
<div class="account">
<div style="width:30px;height:30px;border-radius:50%;background:#d2c6b4;border:1px solid #bfb29c;display:flex;align-items:center;justify-content:center;font:600 12px 'Noto Serif TC',serif;flex:none;color:#2b2822">超</div>
<div style="display:flex;flex-direction:column;line-height:1.3;min-width:0">
<span style="font:500 13px 'Noto Sans TC';color:#2b2822">超級管理員</span>
<span style="font:400 10.5px 'Noto Sans TC';color:#8c7f6c">可查看完整日誌</span>
</div>
</div>
</aside>

<main style="min-width:0;display:flex;flex-direction:column;background:#f7f4ee">

<header class="pad" style="display:flex;align-items:center;gap:14px;border-bottom:1px solid #ded7c9;flex-wrap:wrap">
<h1 style="font:700 19px 'Noto Serif TC',serif;margin:0">操作日誌</h1>
<span style="font:400 13px 'Noto Sans TC';color:#6c6659">{{ count }} 筆</span>
</header>

<div class="pad" style="display:flex;flex-direction:column;gap:18px;padding-bottom:60px">

<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
<button onClick="{{ f.onClick }}" style="border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};border-radius:99px;padding:6px 14px;font:400 13px 'Noto Sans TC';cursor:pointer">{{ f.label }}</button>
</sc-for>
<input value="{{ search }}" onChange="{{ setSearch }}" placeholder="搜尋操作人或內容" style="margin-left:auto;border:1px solid #ded7c9;border-radius:99px;background:#fdfbf6;padding:7px 14px;font:400 13px 'Noto Sans TC';color:#22201c;width:200px">
</div>

<section style="border:1px solid #ded7c9;border-radius:4px;background:#fdfbf6;overflow:hidden">
<div class="logrow" style="padding:11px 20px;background:#efeade;font:500 11.5px 'Noto Sans TC';color:#4a463d;letter-spacing:.04em">
<span>時間</span><span>內容</span><span>類別</span>
</div>
<sc-for list="{{ logs }}" as="l" hint-placeholder-count="8">
<div class="logrow" style="padding:13px 20px;border-top:1px solid #ece6da;align-items:baseline">
<span style="font:500 12.5px ui-monospace,Menlo,monospace;color:#6c6659">{{ l.time }}</span>
<div style="min-width:0"><span style="font:500 13.5px 'Noto Sans TC';color:#22201c">{{ l.actor }}</span> <span style="font:400 13.5px 'Noto Sans TC';color:#4a463d">{{ l.text }}</span></div>
<span style="font:500 11.5px 'Noto Sans TC';color:{{ l.catFg }};background:{{ l.catBg }};border-radius:2px;padding:2px 8px;justify-self:start">{{ l.category }}</span>
</div>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div style="padding:34px 20px;text-align:center;font:400 13px 'Noto Sans TC';color:#6c6659">沒有符合條件的紀錄</div>
</sc-if>
</section>
<p style="font:400 12px/1.8 'Noto Sans TC';color:#6c6659;margin:0">日誌保留 2 年，記錄費率變更、驗證審核、仲裁裁定與帳號權限異動，供財務與稽核查閱。</p>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const NAV = [
  { num: "01", label: "金流總覽", href: "./StepGo Admin Cashflow.dc.html" },
  { num: "02", label: "費用設定", href: "./StepGo Admin Fees.dc.html" },
  { num: "03", label: "老師與課程", href: "./StepGo Admin Directory.dc.html" },
  { num: "04", label: "帳號與權限", href: "./StepGo Admin Accounts.dc.html" },
  { num: "05", label: "仲裁案件", href: "./StepGo Arbitration.dc.html" },
  { num: "06", label: "帳戶審核", href: "./StepGo Teacher Verification.dc.html" },
  { num: "07", label: "操作日誌", href: "#", active: true }
];

const CAT_COLOR = {
  "費率": ["#fdf7f0","#a7622c"], "驗證": ["#e3ecec","#2f5560"], "仲裁": ["#eae4d4","#7a6a3c"],
  "權限": ["#f6ece2","#8a4b3f"], "撥款": ["#e3ecec","#2f5560"]
};

const LOGS = [
  { time: "09/11 09:40", actor: "王苡萱", text: "排定平台服務費由 10% 調整為 12%，將於 10/11 生效。", category: "費率" },
  { time: "09/10 16:22", actor: "陳姿妃", text: "裁定仲裁案件 AB-00042：維持老師原決定，退還 1,235 元。", category: "仲裁" },
  { time: "09/10 11:05", actor: "游柏廷", text: "核准老師「許雅涵」的身分驗證申請。", category: "驗證" },
  { time: "09/09 14:50", actor: "王苡萱", text: "邀請「李承恩」加入，角色設為財務。", category: "權限" },
  { time: "09/08 10:12", actor: "系統", text: "手沖咖啡入門課程 09 月撥款批次已執行，共 22 位老師。", category: "撥款" },
  { time: "09/05 15:30", actor: "陳姿妃", text: "駁回老師「鄭立群」的身分驗證申請（證件反光無法辨識）。", category: "驗證" },
  { time: "05/12 09:00", actor: "王苡萱", text: "退款處理費由 30 元調整為 25 元，即時生效。", category: "費率" },
  { time: "05/03 13:15", actor: "李承恩", text: "移除成員「舊財務帳號」的存取權限。", category: "權限" }
];

class Component extends DCLogic {
  state = { cat: "all", search: "" };
  renderVals() {
    const { cat } = this.state;
    const q = this.state.search.trim().toLowerCase();
    const logs = LOGS.filter(l => (cat === "all" || l.category === cat) && (!q || (l.actor + l.text).toLowerCase().includes(q)))
      .map(l => { const [bg, fg] = CAT_COLOR[l.category]; return { ...l, catBg: bg, catFg: fg }; });
    const cats = ["all", "費率", "驗證", "仲裁", "權限", "撥款"];
    return {
      nav: NAV.map(n => ({
        ...n,
        font: (n.active ? "500" : "400") + " 13.5px 'Noto Sans TC'",
        bg: n.active ? "#d2c6b4" : "transparent",
        fg: n.active ? "#22201c" : "#5c5347",
        dim: n.active ? "#a7622c" : "#a89a84"
      })),
      count: logs.length, logs, empty: logs.length === 0,
      search: this.state.search, setSearch: e => this.setState({ search: e.target.value }),
      filters: cats.map(c => ({
        label: c === "all" ? "全部" : c, onClick: () => this.setState({ cat: c }),
        border: cat === c ? "#22201c" : "#ded7c9",
        bg: cat === c ? "#efeade" : "transparent",
        fg: cat === c ? "#22201c" : "#4a463d"
      }))
    };
  }
}
</script>
</body>
</html>
