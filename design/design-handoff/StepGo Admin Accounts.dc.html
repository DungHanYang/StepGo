<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>
body{margin:0;background:#f2eee6;color:#22201c;font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#22201c;text-decoration:underline}a:hover{color:#4a463d}
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh;align-items:stretch}
.side{background:#e3dcd1;color:#2b2822;display:flex;flex-direction:column;gap:4px;padding:20px 13px 24px}
.side .brand{display:flex;align-items:center;gap:10px;color:#2b2822;padding:4px 8px 18px;flex:none}
.side .account{margin-top:auto;border-top:1px solid #cfc4b2;padding:14px 0 0 8px;display:flex;align-items:center;gap:9px}
.pad{padding:22px 30px}
.rolegrid{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(4,84px);gap:9px}
@media(max-width:1080px){
 .shell{grid-template-columns:1fr}
 .side{flex-direction:row;align-items:center;gap:10px;padding:10px 14px;overflow:auto}
 .side .brand{padding:0 10px 0 0}
 .side .account{display:none !important}
 .pad{padding:18px 22px}
}
@media(max-width:640px){
 .pad{padding:15px 16px}
 .rolegrid{grid-template-columns:minmax(0,1fr);gap:4px}
}
</style></helmet>

<div class="shell">

<aside class="side">
<div class="brand">
<div style="width:32px;height:32px;border-radius:50%;border:1px solid #bfb29c;background:#d2c6b4;display:flex;align-items:center;justify-content:center;font:700 14px 'Noto Serif TC',serif;flex:none;color:#2b2822">學</div>
<div style="display:flex;flex-direction:column;line-height:1.15">
<span style="font:700 14px 'Noto Serif TC',serif">學步</span>
<span style="font:500 9px 'EB Garamond',serif;letter-spacing:.2em;color:#8c7f6c">ADMIN</span>
</div>
</div>
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
<a href="{{ n.href }}" style="display:flex;align-items:center;gap:10px;border-radius:3px;padding:9px 10px;font:{{ n.font }};background:{{ n.bg }};color:{{ n.fg }};flex:none;white-space:nowrap">
<span style="font:400 12px 'EB Garamond',serif;color:{{ n.dim }};width:14px;flex:none">{{ n.num }}</span>{{ n.label }}
</a>
</sc-for>
<div class="account">
<div style="width:30px;height:30px;border-radius:50%;background:#d2c6b4;border:1px solid #bfb29c;display:flex;align-items:center;justify-content:center;font:600 12px 'Noto Serif TC',serif;flex:none;color:#2b2822">超</div>
<div style="display:flex;flex-direction:column;line-height:1.3;min-width:0">
<span style="font:500 13px 'Noto Sans TC';color:#2b2822">超級管理員</span>
<span style="font:400 10.5px 'Noto Sans TC';color:#8c7f6c">可管理帳號與權限</span>
</div>
</div>
</aside>

<main style="min-width:0;display:flex;flex-direction:column;background:#f7f4ee">

<header class="pad" style="display:flex;align-items:center;gap:14px;border-bottom:1px solid #ded7c9;flex-wrap:wrap">
<h1 style="font:700 19px 'Noto Serif TC',serif;margin:0">帳號與權限</h1>
<span style="font:400 13px 'Noto Sans TC';color:#6c6659">{{ memberCount }} 位管理人員</span>
<button onClick="{{ openInvite }}" style="margin-left:auto;border:none;background:#22201c;color:#f7f4ee;border-radius:3px;padding:9px 15px;font:500 13px 'Noto Sans TC';cursor:pointer">＋ 邀請成員</button>
</header>

<div class="pad" style="display:flex;flex-direction:column;gap:26px;padding-bottom:60px">

<sc-if value="{{ isInviting }}" hint-placeholder-val="{{ false }}">
<section style="border:1px solid #22201c;border-radius:4px;background:#fdfbf6;padding:22px 24px;display:flex;flex-direction:column;gap:14px;max-width:36em">
<h2 style="font:700 16px 'Noto Serif TC',serif;margin:0">邀請新成員</h2>
<label style="display:flex;flex-direction:column;gap:5px">
<span style="font:500 12.5px 'Noto Sans TC';color:#4a463d">Email</span>
<input value="{{ inviteEmail }}" onChange="{{ setInviteEmail }}" placeholder="name@stepgo.tw" style="border:1px solid #ded7c9;border-radius:3px;background:#fff;padding:10px 12px;font:400 14px 'Noto Sans TC';color:#22201c;width:100%;box-sizing:border-box">
</label>
<label style="display:flex;flex-direction:column;gap:5px">
<span style="font:500 12.5px 'Noto Sans TC';color:#4a463d">角色</span>
<select value="{{ inviteRole }}" onChange="{{ setInviteRole }}" style="border:1px solid #ded7c9;border-radius:3px;background:#fff;padding:10px 12px;font:400 14px 'Noto Sans TC';color:#22201c;width:100%;box-sizing:border-box">
<sc-for list="{{ roleNames }}" as="r" hint-placeholder-count="4"><option value="{{ r }}">{{ r }}</option></sc-for>
</select>
</label>
<div style="display:flex;gap:10px">
<button onClick="{{ sendInvite }}" style="border:none;background:#22201c;color:#f7f4ee;border-radius:3px;padding:11px 20px;font:500 13.5px 'Noto Sans TC';cursor:pointer">送出邀請</button>
<button onClick="{{ closeInvite }}" style="border:1px solid #ded7c9;background:none;color:#4a463d;border-radius:3px;padding:11px 18px;font:400 13.5px 'Noto Sans TC';cursor:pointer">取消</button>
</div>
</section>
</sc-if>

<section style="border:1px solid #ded7c9;border-radius:4px;background:#fdfbf6;overflow:hidden">
<div style="padding:16px 20px;border-bottom:1px solid #ded7c9"><h2 style="font:700 16px 'Noto Serif TC',serif;margin:0">成員</h2></div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 130px 110px 100px;gap:10px;padding:11px 20px;background:#efeade;font:500 11.5px 'Noto Sans TC';color:#4a463d;letter-spacing:.04em">
<span>成員</span><span>角色</span><span>最後登入</span><span style="text-align:right">操作</span>
</div>
<sc-for list="{{ members }}" as="m" hint-placeholder-count="5">
<div style="display:grid;grid-template-columns:minmax(0,1fr) 130px 110px 100px;gap:10px;padding:13px 20px;border-top:1px solid #ece6da;align-items:center">
<div style="min-width:0;display:flex;align-items:center;gap:10px">
<div style="width:30px;height:30px;border-radius:50%;background:#efeade;border:1px solid #ded7c9;display:flex;align-items:center;justify-content:center;font:600 12px 'Noto Serif TC',serif;flex:none">{{ m.initial }}</div>
<div style="min-width:0"><div style="font:500 13.5px 'Noto Sans TC';color:#22201c">{{ m.name }}</div><div style="font:400 11.5px 'Noto Sans TC';color:#6c6659">{{ m.email }}</div></div>
</div>
<span style="font:500 12px 'Noto Sans TC';color:{{ m.roleFg }};background:{{ m.roleBg }};border-radius:2px;padding:3px 8px;justify-self:start">{{ m.role }}</span>
<span style="font:400 12.5px 'Noto Sans TC';color:#6c6659">{{ m.lastLogin }}</span>
<div style="text-align:right"><a href="#" onClick="{{ m.onRemove }}" style="font:400 12.5px 'Noto Sans TC';color:#8a4b3f">移除</a></div>
</div>
</sc-for>
</section>

<section style="border:1px solid #ded7c9;border-radius:4px;background:#fdfbf6;padding:22px 24px;display:flex;flex-direction:column;gap:14px">
<div style="border-bottom:1px solid #ece6da;padding-bottom:12px"><h2 style="font:700 16px 'Noto Serif TC',serif;margin:0">角色權限</h2></div>
<div class="rolegrid" style="font:500 11px 'Noto Sans TC';color:#6c6659;letter-spacing:.03em;padding-bottom:4px">
<span>權限項目</span><sc-for list="{{ roleNames }}" as="r" hint-placeholder-count="4"><span style="text-align:center">{{ r }}</span></sc-for>
</div>
<sc-for list="{{ permMatrix }}" as="row" hint-placeholder-count="6">
<div class="rolegrid" style="padding-bottom:10px;border-bottom:1px solid #ece6da;align-items:center">
<span style="font:400 13.5px 'Noto Sans TC';color:#4a463d">{{ row.label }}</span>
<sc-for list="{{ row.marks }}" as="c" hint-placeholder-count="4">
<span style="text-align:center;font:600 14px 'Noto Sans TC';color:{{ c.color }}">{{ c.mark }}</span>
</sc-for>
</div>
</sc-for>
<p style="font:400 12.5px/1.8 'Noto Sans TC';color:#6c6659;margin:0;text-wrap:pretty">「超級管理員」是唯一能新增/移除成員與調整角色權限的角色，至少須保留一位。</p>
</section>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const NAV = [
  { num: "01", label: "金流總覽", href: "./StepGo Admin Cashflow.dc.html" },
  { num: "02", label: "費用設定", href: "./StepGo Admin Fees.dc.html" },
  { num: "03", label: "老師與課程", href: "./StepGo Admin Directory.dc.html" },
  { num: "04", label: "帳號與權限", href: "#", active: true },
  { num: "05", label: "仲裁案件", href: "./StepGo Arbitration.dc.html" },
  { num: "06", label: "帳戶審核", href: "./StepGo Teacher Verification.dc.html" },
  { num: "07", label: "操作日誌", href: "./StepGo Admin Audit Log.dc.html" }
];

const ROLES = ["超級管理員", "財務", "客服", "唯讀"];
const ROLE_COLOR = { "超級管理員": ["#f6ece2","#8a4b3f"], "財務": ["#e3ecec","#2f5560"], "客服": ["#eae4d4","#7a6a3c"], "唯讀": ["#efeade","#6c6659"] };

const PERMS = [
  { label: "查看金流總覽", allow: ["超級管理員","財務","唯讀"] },
  { label: "調整費用設定", allow: ["超級管理員","財務"] },
  { label: "審核老師身分驗證", allow: ["超級管理員","客服"] },
  { label: "處理平台仲裁", allow: ["超級管理員","客服"] },
  { label: "手動調整撥款", allow: ["超級管理員","財務"] },
  { label: "管理成員與權限", allow: ["超級管理員"] }
];

const MEMBERS = [
  { name: "王苡萱", email: "yixuan.wang@stepgo.tw", role: "超級管理員", lastLogin: "今天 09:12" },
  { name: "李承恩", email: "chengen.li@stepgo.tw", role: "財務", lastLogin: "昨天 17:40" },
  { name: "陳姿妃", email: "tzufei.chen@stepgo.tw", role: "客服", lastLogin: "今天 10:05" },
  { name: "游柏廷", email: "poting.you@stepgo.tw", role: "客服", lastLogin: "09/09" },
  { name: "會計師事務所", email: "audit@partner-cpa.tw", role: "唯讀", lastLogin: "09/01" }
];

class Component extends DCLogic {
  state = { inviting: false, inviteEmail: "", inviteRole: ROLES[2], removed: [] };
  renderVals() {
    const s = this.state;
    const members = MEMBERS.filter(m => !s.removed.includes(m.email)).map(m => {
      const [bg, fg] = ROLE_COLOR[m.role];
      return { ...m, initial: m.name[0], roleBg: bg, roleFg: fg, onRemove: (e) => { e.preventDefault(); this.setState(st => ({ removed: [...st.removed, m.email] })); } };
    });
    return {
      nav: NAV.map(n => ({
        ...n,
        font: (n.active ? "500" : "400") + " 13.5px 'Noto Sans TC'",
        bg: n.active ? "#d2c6b4" : "transparent",
        fg: n.active ? "#22201c" : "#5c5347",
        dim: n.active ? "#a7622c" : "#a89a84"
      })),
      memberCount: members.length, members,
      roleNames: ROLES,
      isInviting: s.inviting,
      openInvite: () => this.setState({ inviting: true }),
      closeInvite: () => this.setState({ inviting: false, inviteEmail: "" }),
      inviteEmail: s.inviteEmail, inviteRole: s.inviteRole,
      setInviteEmail: e => this.setState({ inviteEmail: e.target.value }),
      setInviteRole: e => this.setState({ inviteRole: e.target.value }),
      sendInvite: () => this.setState({ inviting: false, inviteEmail: "" }),
      permMatrix: PERMS.map(p => ({
        label: p.label,
        marks: ROLES.map(r => ({ mark: p.allow.includes(r) ? "✓" : "—", color: p.allow.includes(r) ? "#2f5560" : "#c9c2b2" }))
      }))
    };
  }
}
</script>
</body>
</html>
